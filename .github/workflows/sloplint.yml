name: sloplint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  changed:
    name: slop check (diff scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: files
        name: Collect changed Python files
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}"...HEAD -- '*.py' | tr '\n' ' ')
          echo "Changed: ${CHANGED:-<none>}"
          echo "paths=$CHANGED" >> "$GITHUB_OUTPUT"

      - if: steps.files.outputs.paths != ''
        uses: danielhuadotcom/sloplint2@v0.5.0
        with:
          paths: ${{ steps.files.outputs.paths }}
          comment: "true"
          upload-sarif: "false"
          fail-on-findings: "true"

      - if: always() && hashFiles('sloplint.sarif') != ''
        name: Post inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/review.sh sloplint.sarif sloplint

  tree:
    name: slop check (repo scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: danielhuadotcom/sloplint2@v0.5.0
        with:
          paths: .
          comment: "false"
          upload-sarif: "false"
          fail-on-findings: "true"

  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    env:
      RUFF_SELECT: E,F,N,PLE,PLC,I,B,UP
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: --version

      - name: Run ruff
        run: |
          ruff check --select "$RUFF_SELECT" --output-format sarif --output-file ruff.sarif . || true
          ruff check --select "$RUFF_SELECT" .

      - if: always() && hashFiles('ruff.sarif') != ''
        name: Post inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/review.sh ruff.sarif ruff
