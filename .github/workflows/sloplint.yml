name: sloplint

# pull_request_target runs this file and the scripts as they are on main, so a PR can't change or
# delete the checks that judge it. The PR is checked out into pr/ only as data: nothing from it is
# executed, and every tool reads its config from main, never from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  SCRIPTS: ${{ github.workspace }}/trusted/.github/scripts

jobs:
  slop:
    name: slop check
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - name: Install the latest sloplint release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R danielhuadotcom/sloplint2 --json tagName -q '"sloplint " + .tagName'
          gh release download -R danielhuadotcom/sloplint2 -p sloplint-x86_64-unknown-linux-gnu.tar.gz -O - |
            tar -xz -C "$RUNNER_TEMP"
          echo "SLOPLINT=$RUNNER_TEMP/sloplint" >> "$GITHUB_ENV"
          echo "SLOPLINT_CONFIG=$GITHUB_WORKSPACE/trusted/.github/sloplint.toml" >> "$GITHUB_ENV"

      - name: Lint the base and the PR merge commit
        working-directory: pr
        run: |
          "$SCRIPTS/check-merge.sh" "$HEAD_SHA"
          merge=$(git rev-parse HEAD)
          git checkout -q HEAD^1
          "$SCRIPTS/sloplint.sh" "$RUNNER_TEMP/base.sarif"
          git checkout -q "$merge"
          "$SCRIPTS/sloplint.sh" sloplint.sarif

      - name: Post new findings as review comments
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DIR_RULES: SLP090
        run: '"$SCRIPTS/review.sh" sloplint sloplint.sarif "$RUNNER_TEMP/base.sarif"'

  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    env:
      RUFF_SELECT: E,F,N,PLE,PLC,I,B,UP
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: latest
          args: --version

      # --isolated ignores every ruff config file, so the PR can't turn rules off.
      - name: Run ruff
        working-directory: pr
        run: |
          "$SCRIPTS/check-merge.sh" "$HEAD_SHA"
          mapfile -d '' files < <("$SCRIPTS/tracked-files.sh" '*.py' '*.pyi' '*.ipynb')
          if ((${#files[@]} == 0)); then
            echo '{"runs": []}' > ruff.sarif
            exit 0
          fi
          ruff check --isolated --select "$RUFF_SELECT" --output-format sarif --output-file ruff.sarif "${files[@]}" || true
          ruff check --isolated --select "$RUFF_SELECT" "${files[@]}"

      - if: always() && hashFiles('pr/ruff.sarif') != ''
        name: Post inline review comments
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$SCRIPTS/review.sh" ruff ruff.sarif'

  rules:
    name: pr rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false

      - name: Check out the PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check files, commit messages and README length
        working-directory: pr
        run: |
          "$SCRIPTS/check-merge.sh" "$HEAD_SHA"
          "$SCRIPTS/pr-rules.sh" HEAD^1 HEAD^2
