name: sloplint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  slop:
    name: slop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check out the base commit
        run: git checkout -q HEAD^1

      - name: Lint the base commit
        uses: danielhuadotcom/sloplint2@v0.5.0
        with:
          paths: .
          comment: "false"
          upload-sarif: "false"
          fail-on-findings: "false"

      - name: Check out the PR merge commit
        run: |
          mv sloplint.sarif "$RUNNER_TEMP/base.sarif"
          git checkout -q "$GITHUB_SHA"

      - name: Lint the PR merge commit
        uses: danielhuadotcom/sloplint2@v0.5.0
        with:
          paths: .
          comment: "false"
          upload-sarif: "false"
          fail-on-findings: "false"

      - name: Post new findings as review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIR_RULES: SLP090
        run: .github/scripts/review.sh sloplint sloplint.sarif "$RUNNER_TEMP/base.sarif"

  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    env:
      RUFF_SELECT: E,F,N,PLE,PLC,I,B,UP
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: --version

      - name: Run ruff
        run: |
          ruff check --select "$RUFF_SELECT" --output-format sarif --output-file ruff.sarif . || true
          ruff check --select "$RUFF_SELECT" .

      - if: always() && hashFiles('ruff.sarif') != ''
        name: Post inline review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/review.sh ruff ruff.sarif
